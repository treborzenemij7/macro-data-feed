name: macro-feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FRED and Finnhub data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse, datetime

          fk = os.environ["FRED_API_KEY"]
          hk = os.environ["FINNHUB_API_KEY"]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          out = {"updated_utc": now, "fred": {}, "finnhub": {}, "errors": []}

          def get(url):
              with urllib.request.urlopen(url, timeout=20) as r:
                  return json.load(r)

          for sid in ["DFII10", "DGS2", "DGS10", "DTWEXBGS"]:
              try:
                  q = urllib.parse.urlencode({
                      "series_id": sid, "api_key": fk, "file_type": "json",
                      "sort_order": "desc", "limit": 5})
                  d = get("https://api.stlouisfed.org/fred/series/observations?" + q)
                  obs = [o for o in d["observations"] if o["value"] != "."]
                  out["fred"][sid] = obs[0] if obs else None
              except Exception as e:
                  out["errors"].append("FRED " + sid + ": " + type(e).__name__)

          for sym in ["QQQ", "SPY", "GLD"]:
              try:
                  d = get("https://finnhub.io/api/v1/quote?symbol=" + sym + "&token=" + hk)
                  out["finnhub"][sym] = d
              except Exception as e:
                  out["errors"].append("Finnhub " + sym + ": " + type(e).__name__)

          os.makedirs("data", exist_ok=True)
          with open("data/macro.json", "w") as f:
              json.dump(out, f, indent=2)
          print(json.dumps(out, indent=2))
          EOF

      - name: Commit data
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/macro.json
          git diff --cached --quiet || (git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
